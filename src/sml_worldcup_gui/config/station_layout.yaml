# Optional, user-editable station layout — see layout_config.py for the
# format and exactly how this interacts with the real-waypoint-driven
# positions (short version: anything listed here overrides that station's
# box position for a nicer/​map.jpg-like arrangement; the AMR marker still
# always uses real robocup_waypoint.yaml data, so it stays trustworthy).
#
# The coordinates below are a rough *starting point* sketched from the
# general "two workbenches + shared storage between two sides" arrangement
# described for the World Cup 2026 arena — not measured pixel-for-pixel
# from map.jpg. Nudge freely; canvas space is 1000x580 (see layout_schema.py
# CANVAS_W/CANVAS_H), origin top-left, x right, y down.
#
# Delete or empty this file (or point layout_yaml:="" at launch) to fall
# back to pure real-waypoint positioning for every station.

stations:
  side_a_customer_1:   {x: 180, y: 60}
  side_a_workbench_1:  {x: 100, y: 140}
  side_a_workbench_2:  {x: 260, y: 140}
  side_a_hybrid_1:     {x: 180, y: 230}
  side_a_storage_1:    {x: 80,  y: 340}
  side_a_storage_2:    {x: 180, y: 400}
  side_a_storage_3:    {x: 280, y: 460}

  side_b_customer_1:   {x: 820, y: 60}
  side_b_workbench_1:  {x: 900, y: 140}
  side_b_workbench_2:  {x: 740, y: 140}
  side_b_hybrid_1:     {x: 820, y: 230}
  side_b_storage_1:    {x: 920, y: 340}
  side_b_storage_2:    {x: 820, y: 400}
  side_b_storage_3:    {x: 720, y: 460}

  shared_storage_1:    {x: 500, y: 300}

boxes:
  - {x0: 20,  y0: 520, x1: 180, y1: 570, label: "START / GOAL — A", dash: true}
  - {x0: 820, y0: 520, x1: 980, y1: 570, label: "START / GOAL — B", dash: true}

labels:
  - {x: 180, y: 495, text: "Wait A"}
  - {x: 820, y: 495, text: "Wait B"}
